# applespi drives the SPI keyboard/trackpad of 2016-and-later MacBooks. This is
# a MacBookAir7,2, whose keyboard and trackpad are USB (bcm5974 + hid_apple), so
# the driver binds nothing -- it logs "USB interface already enabled" and stops.
# Keeping it out removes one more module from the suspend/resume path.
#
# It loads after switch-root, so no initramfs rebuild is needed.
# Local -- delete this file to undo.
blacklist applespi
